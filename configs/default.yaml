# ============================================================
# Downstream sentiment models
# run_name includes {dataset_key}, so changing dataset_key avoids reusing old models.
# ============================================================
models:
  encoder_only:
    enabled: true
    run_name: distilbert_{dataset_key}_confidence
    architecture: encoder_only
    model_id: distilbert-base-uncased
    max_length: 128
    eval_batch_size: 32

  decoder_only:
    enabled: true
    run_name: distilgpt2_{dataset_key}_confidence
    architecture: decoder_only
    model_id: distilgpt2
    max_length: 160
    prompt_template: "Review: {text}\nSentiment:"
    train_template: "Review: {text}\nSentiment: {label}"
    label_texts:
      0: " negative"
      1: " positive"

  encoder_decoder:
    enabled: true
    run_name: t5small_{dataset_key}_confidence
    architecture: encoder_decoder
    model_id: t5-small
    max_source_length: 128
    max_target_length: 8
    source_prefix: "classify sentiment: "
    label_texts:
      0: "negative"
      1: "positive"

downstream_training:
  num_train_epochs: 3
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.06
  logging_steps: 50
  save_total_limit: 1
  fp16: false
  gradient_accumulation_steps: 1

# ============================================================
# Neural cleaner models
# They are trained on noisy-clean pairs generated from current downstream train text.
# ============================================================
cleaner_models:
  encoder_decoder_cleaner:
    enabled: true
    run_name: ediclean_t5small_{dataset_key}_confidence
    architecture: encoder_decoder_cleaner
    model_id: t5-small
    source_prefix: "correct: "
    max_source_length: 128
    max_target_length: 128
    clean_batch_size: 16
    num_beams: 4
    use_cache: true

  decoder_only_cleaner:
    enabled: true
    run_name: decoderclean_distilgpt2_{dataset_key}_confidence
    architecture: decoder_only_cleaner
    model_id: distilgpt2
    max_length: 192
    max_new_tokens: 96
    clean_batch_size: 8
    num_beams: 1
    prompt_template: "Correct the noisy sentence.\nInput: {noisy}\nOutput:"
    train_template: "Correct the noisy sentence.\nInput: {noisy}\nOutput: {clean}"
    use_cache: true

cleaner_training:
  num_train_epochs: 3
  per_device_train_batch_size: 8
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_ratio: 0.06
  logging_steps: 50
  save_total_limit: 1
  fp16: false
  gradient_accumulation_steps: 1

# ============================================================
# Non-neural cleaning baseline
# ============================================================
algorithmic_cleaner:
  enabled: true
  name: ruleclean
  lowercase: false
  normalize_whitespace: true
  reduce_repeated_chars: true
  spellcheck: true
  min_token_length: 4
  preserve_case: true
  use_cache: true
