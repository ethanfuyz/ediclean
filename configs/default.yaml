project_name: ediclean_confidence_sst2
seed: 42

paths:
  output_dir: outputs
  results_file: outputs/results.json
  predictions_file: outputs/predictions.json
  cache_dir: cache
  downstream_model_dir: models/downstream
  cleaner_model_dir: models/cleaners

# ============================================================
# Dataset
# ============================================================
# Default: SST-2.
# You can switch dataset by changing only dataset_key.
# Supported presets in src/ediclean/data.py:
#   sst2, imdb, yelp_polarity, rotten_tomatoes, amazon_polarity
#
# For SST-2:
#   text_field = sentence
#   label_field = label
#
# For IMDB/Yelp/Rotten Tomatoes:
#   text_field is automatically resolved by the preset.
# ============================================================
downstream_dataset:
  dataset_key: sst2

  # Optional controls. For full SST-2, keep null.
  max_train_samples: null
  max_eval_samples: null
  max_test_samples: null

  # Keep true so ordered datasets like IMDB do not produce one-class validation subsets.
  balanced_sampling: true
  shuffle_before_select: true

# Cleaner training data.
# source: downstream_train means:
#   current dataset train clean text -> generate noisy-clean pairs
# For default SST-2:
#   noisy SST-2 sentence -> clean SST-2 sentence
cleaner_dataset:
  source: downstream_train
  max_train_samples: null
  validation_fraction: 0.05
  max_eval_samples: 1000

# ============================================================
# Human-like noise
# ============================================================
noise:
  enabled: true
  type: human_like
  ratio: 0.40
  min_word_length: 4
  focus_sentiment_words: true
  preserve_label: true
  punctuation_drop_prob: 0.75
  ops_multiplier: 10

  human_like_weights:
    char_swap: 0.16
    char_delete: 0.15
    char_insert: 0.14
    keyboard_substitute: 0.13
    repeat_char: 0.10
    punctuation_drop: 0.08
    function_word_drop: 0.11
    word_drop: 0.05
    word_order: 0.06
    lowercase: 0.02

